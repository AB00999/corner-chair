name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r barber-booking-demo/requirements.txt
          pip install pylint black isort
      
      - name: Check code formatting with black
        run: |
          black --check barber-booking-demo/app.py barber-booking-demo/tests/ || true
      
      - name: Check import sorting with isort
        run: |
          isort --check-only barber-booking-demo/app.py barber-booking-demo/tests/ || true
      
      - name: Lint with pylint
        run: |
          pylint barber-booking-demo/app.py --exit-zero --max-line-length=120
